<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS · Second Brain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%235eead4' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%235eead4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/brain.css">
</head>
<body data-state="connecting">
<canvas id="graph" aria-label="Knowledge graph. Use search, hubs and the filter list to navigate with a keyboard."></canvas>
<div id="tooltip" class="tooltip" hidden></div>
<div id="handCursor" class="hand-cursor" hidden></div>

<aside class="left" id="left">
  <button class="collapse" id="collapseLeft" title="Hide panel" aria-label="Hide left panel">«</button>
  <div class="vault-head">
    <h1 id="vaultName">SECOND BRAIN</h1>
    <small id="counts">Loading…</small>
    <div class="scope" role="group" aria-label="Graph scope">
      <button id="scopeVault" type="button">Vault only</button><button id="scopeAll" type="button" class="on">All layers</button>
    </div>
  </div>
  <div class="search-wrap">
    <input id="search" placeholder="Search the brain…" autocomplete="off" aria-label="Search the brain (press / )">
    <div id="searchResults" class="results"></div>
  </div>
  <section>
    <h4>Inspector</h4>
    <div id="inspector" class="card inspector"></div>
  </section>
  <section id="sourcesBox" hidden>
    <h4>Assistant sources <button id="clearSources" type="button" class="link">clear</button></h4>
    <p id="sourcesStatus" class="muted" role="status"></p>
    <div id="sourcesList"></div>
  </section>
  <section>
    <h4>Top hubs</h4>
    <div id="hubs" class="card list"></div>
  </section>
  <section>
    <h4>Forces</h4>
    <div class="card">
      <label class="slider">Repel <input type="range" id="repel" min="0" max="100" value="62"></label>
      <label class="slider">Link length <input type="range" id="linkLength" min="0" max="100" value="52"></label>
    </div>
  </section>
  <section>
    <h4>Display</h4>
    <div class="card toggles">
      <label><input type="checkbox" id="showLabels" checked> Labels</label>
      <label><input type="checkbox" id="showFlow" checked> Signal flow</label>
      <label><input type="checkbox" id="showStars" checked> Starfield</label>
    </div>
  </section>
  <footer class="hint">drag = orbit · right-drag = pan · scroll = zoom<br>click = focus · right-click = read · shift-click = path · / = search</footer>
</aside>
<button class="expand" id="expandLeft" hidden aria-label="Show left panel">»</button>

<div class="toolbar" role="toolbar" aria-label="Graph view">
  <button id="fit" type="button" title="Fit everything (F)">◎ Fit</button>
  <button id="dimension" type="button" title="Switch 2D / 3D">3D</button>
  <button id="orbit" type="button" aria-pressed="false" title="Slow auto-rotate">⟳</button>
  <button id="refresh" type="button" title="Reload your vault">↻</button>
</div>

<aside class="right">
  <div class="card filter">
    <h4>Filter</h4>
    <div id="filters"></div>
  </div>
  <div class="reactor-wrap">
    <canvas id="reactor" width="380" height="380" aria-label="JARVIS status"></canvas>
    <div class="pills">
      <span class="pill" id="online"><i></i><b>OFFLINE</b></span>
      <button class="pill model" id="modelPill" type="button" title="Change JARVIS's brain">◆ <b id="modelName">—</b></button>
    </div>
    <div class="appearance" role="group" aria-label="Appearance">
      <button type="button" data-look="ring" class="on">RING</button><button type="button" data-look="cube">CUBE</button><button type="button" data-look="face">FACE</button>
    </div>
    <div class="state-text" id="stateText" role="status">Connecting…</div>
  </div>
  <div class="modes" id="modes">
    <button class="mode" type="button" data-mode="eyes"><span>EYES</span><em>off</em></button>
    <button class="mode" type="button" data-mode="watch"><span>WATCH</span><em>off</em></button>
    <button class="mode" type="button" data-mode="holo"><span>HOLO</span><em>off</em></button>
    <button class="mode" type="button" data-mode="focus"><span>FOCUS</span><em>off</em></button>
  </div>
</aside>
<div class="mode-panel card" id="modePanel" hidden role="dialog" aria-label="Mode settings"></div>

<section class="dock" id="dock">
  <div class="reply" id="reply" hidden>
    <div class="reply-head"><small id="replyWho">JARVIS</small><button type="button" class="link" id="historyToggle">history</button></div>
    <div id="replyText"></div>
    <div id="chatLog" role="log" aria-live="polite" hidden></div>
  </div>
  <div class="command-row">
    <form class="command" id="command">
      <input id="prompt" maxlength="3000" autocomplete="off" aria-label="Message JARVIS"
             placeholder='Ask · "remind me…" · "good morning" · "show my notes on…"'>
      <button type="submit" class="send" title="Send" aria-label="Send">↑</button>
    </form>
    <button class="round" type="button" id="micBtn" title="Listening mode" aria-label="Listening mode">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0M12 17v4m-3 0h6"/></svg></button>
    <button class="round stop" type="button" id="stop" title="Stop JARVIS (Ctrl+Alt+J)" aria-label="Stop">
      <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
    <button class="round" type="button" id="screenBtn" title="Ask about my screen" aria-label="Ask about my screen">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8m-4-4v4"/></svg></button>
    <button class="round" type="button" id="activityBtn" title="Activity" aria-label="Activity">
      <svg viewBox="0 0 24 24"><path d="M18 16V11a6 6 0 0 0-12 0v5l-2 2h16zM10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="activityCount" hidden>0</span></button>
    <button class="round" type="button" id="agentsBtn" title="Tasks & agents" aria-label="Tasks and agents">
      <svg viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg></button>
    <button class="round" type="button" id="armoryBtn" title="Tool armory" aria-label="Tool armory">
      <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></button>
    <button class="round" type="button" id="moreBtn" title="More" aria-label="More" aria-haspopup="menu">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
  </div>
  <div class="hint-line" id="hint"></div>
</section>
<div class="menu card" id="moreMenu" role="menu" hidden></div>

<script src="/brain.js"></script>
<script src="/panels.js"></script>
<script src="/modes.js"></script>
</body>
</html>
