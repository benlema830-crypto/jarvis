<!doctype html>
<!-- The workshop's 3D stage. It runs inside a sandboxed frame (no access to the Jarvis page, its storage or its

<html lang="en">
<head>
<meta charset="utf-8">
<style>

canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:0}
canvas.dragging{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;opacity:0}
#labels svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#labels line{stroke:#f4fbf9;stroke-width:1.2}
#labels circle{fill:#fff}
.tag{position:absolute;transform:translate(-50%,-50%);padding:2px 8px;border-radius:5px;background:rgba(4,22,20,.9);border:1px solid rgba(94,234,212,.55);color:#bff5ea;white-space:nowrap;pointer-events:none;font:600 12px "Cascadia Mono",Consolas,monospace}
.tag.gold{border-color:rgba(245,184,61,.7);color:#ffe0a3}
.tag.name{font:600 13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#fff;border-color:rgba(255,255,255,.3);background:rgba(5,12,14,.88)}
.label{position:absolute;transform:translateY(-50%);padding:3px 10px;border-radius:6px;background:rgba(5,12,14,.84);border:1px solid rgba(255,255,255,.16);white-space:nowrap}
</style>
</head>
<body>

<div id="labels"><svg id="lines" aria-hidden="true"></svg></div>

{

  glow(14, 8, 0xffffff, 5, 0, 16, 4); glow(8, 12, 0xcfe9ff, 3, -16, 4, 6); glow(6, 10, 0x5eead4, 2.2, 16, 3, -8); glow(10, 4, 0xffe2b8, 2.5, 4, 2, 18);

const hemi = new THREE.HemisphereLight(0xdcefff, 0x0a1412, .55);

/* Floor: a glowing grid that fades out, and a plane that only shows shadows. */

  vertexShader: 'varying vec2 p; void main(){ p = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',

/* Picking parts: the chosen ones stay as they are; the rest turn to faint ghosts, or vanish with "only". */

const ghost = new THREE.MeshBasicMaterial({ color: 0x9fd6cc, transparent: true, opacity: .06, depthWrite: false });
function applySelection() { paintSelection(); fit(); }

function emptyBench() {   // nothing built yet: a wide floor seen from a little above

  key.position.set(2, 4, 3); camera.near = .01; camera.far = 500; camera.updateProjectionMatrix();

/* ---------- What scene code may call ---------- */

let quietRun = false;
const api = {

    const offset = (Array.isArray(explode) ? explode : [0, 0, 0]).slice(0, 3).map(n => Number.isFinite(+n) ? +n : 0);
    while (offset.length < 3) offset.push(0);

  add(object) { if (!object || !object.isObject3D) throw Error('api.add needs an Object3D'); extras.push(hold(object, quietRun)); },
  onTick(fn) { if (typeof fn === 'function' && ticks.length < 40) ticks.push(fn); },
  print(width, height, draw) {   // a texture drawn with the 2D canvas: lettering, labels, dials
    const sheet = document.createElement('canvas');
    sheet.width = Math.min(2048, Math.max(16, width | 0)); sheet.height = Math.min(2048, Math.max(16, height | 0));

  }

  selected = new Set(); isolate = false;
  motions = []; variantSets = null; rulerPoints = []; rulerLine.visible = false; spin = null;
  while (variantTags.length) variantTags.pop().remove();
  scaleGroup.clear(); scaleBox = null; dimBox.visible = false; for (const key in tags) tags[key].style.display = 'none';
  emptyBench();
}
function run(message) {

  catch (error) { say({ t: 'error', step: message.name, message: String(error && error.message || error).slice(0, 300) }); }
  quietRun = false;
  if (cutting) applyCut();
  if (message.silent) return;
  if (measuring) scaleObject('auto', partsBox(0));
  fit();
  say({ t: 'parts', parts: parts.map(p => ({ name: p.name, description: p.description })), motions: motions.map(m => m.name) });
  reportSizes();

/* ---------- Camera ---------- */
function bounds(k) {
  const box = new THREE.Box3(), moved = new THREE.Box3();
  const chosen = selected.size ? parts.filter(p => selected.has(p.name)) : parts;   // frame what is being looked at
  for (const p of chosen) if (!p.box.isEmpty()) box.union(moved.copy(p.box).translate(p.explode.clone().multiplyScalar(k)));
  if (!selected.size) for (const e of extras) if (!e.box.isEmpty()) box.union(e.box);

}
function fit() {

  if (box.isEmpty()) return;

  radius = Math.max(sphere.radius, .01);
  const width = canvas.clientWidth || 1, height = canvas.clientHeight || 1, tall = height + Math.abs(inset.bottom - inset.top);
  const clearW = Math.max(width - inset.right - inset.left, 200), clearH = Math.max(height - inset.bottom - inset.top, 200);
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));   // of the whole (padded) view height
  const narrow = Math.atan(tan * Math.min(clearH, clearW) / tall);
  orbit.targetTo.copy(sphere.center); orbit.distTo = radius / Math.sin(narrow) * 1.12;
  if (firstFit && !orbit.touched) orbit.elTo = size.y < .4 * Math.max(size.x, size.z) ? .78 : .3;   // look down on flat things
  const flat = bounds(0), ground = Math.max(flat.getSize(V()).x, flat.getSize(V()).z, radius);
  floor.scale.setScalar(ground * 3.2);
  grid.material.uniforms.cells.value = 44;
  key.position.copy(sphere.center).add(V().set(.7, 1.5, .9).multiplyScalar(radius * 2.2)); key.target.position.copy(sphere.center);
  const s = key.shadow.camera; s.left = s.bottom = -radius * 1.6; s.right = s.top = radius * 1.6; s.near = radius * .1; s.far = radius * 8; s.updateProjectionMatrix();
  fill.position.set(-radius * 3, radius * 2, radius * 2); rim.position.set(-radius * 2, radius * 2.5, -radius * 4);
  camera.near = radius / 200; camera.far = radius * 400; camera.updateProjectionMatrix();
}
const inset = { right: 0, bottom: 0, top: 0, left: 0 };
function applyInsets() {   // centre the view in the part of the window nothing floats over
  const width = canvas.clientWidth, height = canvas.clientHeight, down = inset.bottom - inset.top, across = inset.right - inset.left;
  if (!width || !height) return;
  camera.setViewOffset(width + Math.abs(across), height + Math.abs(down), Math.max(across, 0), Math.max(down, 0), width, height);

}
let drag = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, pan: e.button !== 0 || e.shiftKey, x0: e.clientX, y0: e.clientY, button: e.button }; canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging'); });

function hitAt(clientX, clientY) {   // the part under a point of the window, and where on it

  ray.setFromCamera(aim2d, camera);

  const hits = ray.intersectObjects([...owner.keys()], true).filter(h => h.object.isMesh && !(cutting && cutPlane.distanceToPoint(h.point) < 0));
  const solid = h => { const m = h.object.userData.real || h.object.material; const one = Array.isArray(m) ? m[0] : m; return !(one && one.transparent && one.opacity < .5); };

/* ---------- Labels for the pulled-apart view ---------- */
let labelsDirty = true, labelNodes = [];
const NS = 'http://www.w3.org/2000/svg';

    const box = document.createElement('div'); box.className = 'label'; box.textContent = p.name; labelBox.append(box);
    const line = document.createElementNS(NS, 'line'), dot = document.createElementNS(NS, 'circle'); dot.setAttribute('r', 3); lines.append(line, dot);
    return { box, line, dot };

const projected = V();

  labelBox.style.opacity = shown;

    projected.copy(p.centre).add(p.holder.position).project(camera);
    return { i, x: (projected.x + 1) / 2 * width, y: (1 - projected.y) / 2 * height,

  });
  if (!points.some(p => !p.hidden)) { for (const n of labelNodes) n.box.style.display = n.line.style.display = n.dot.style.display = 'none'; return; }

/* ====================================================================================================

   side, saving the model as a file, a turntable clip, and a four-view sheet for the builder's own check.
   ==================================================================================================== */

/* ---------- Photographs of the real thing (sent by the page as data: URLs) ---------- */

}

}
function partsBox(k, only) {
  const box = new THREE.Box3(), moved = new THREE.Box3();
  for (const p of parts) if (!p.box.isEmpty() && (!only || only.has(p.name))) box.union(moved.copy(p.box).translate(p.explode.clone().multiplyScalar(k)));
  return box;
}
function reportSizes() {
  const whole = partsBox(0), size = whole.isEmpty() ? null : whole.getSize(V());
  const each = {}; for (const p of parts.slice(0, 60)) if (!p.box.isEmpty()) each[p.name] = p.box.getSize(V()).toArray().map(v => +v.toFixed(5));
  say({ t: 'sizes', whole: size && size.toArray().map(v => +v.toFixed(5)), parts: each,
        ruler: rulerPoints.length === 2 ? +rulerPoints[0].distanceTo(rulerPoints[1]).toFixed(5) : null });
}
function scaleObject(kind, box) {
  scaleGroup.clear(); scaleBox = null; tags.scale.style.display = 'none';
  if (kind === 'none' || box.isEmpty()) return;
  const size = box.getSize(V()), biggest = Math.max(size.x, size.y, size.z);
  const plain = (color, metal) => new THREE.MeshStandardMaterial({ color, metalness: metal, roughness: .45 });
  let thing, label, width;
  if (biggest < .05) { thing = new THREE.Mesh(new THREE.CylinderGeometry(.01213, .01213, .00175, 48), plain(0xc9c9c9, .9)); thing.position.y = .000875; label = 'US quarter · 24 mm'; width = .0243; }
  else if (biggest < .3) { thing = new THREE.Mesh(new THREE.BoxGeometry(.0856, .054, .0008), plain(0x2f6f9e, .2)); thing.position.y = .027; label = 'Bank card · 86 mm'; width = .0856; }
  else if (biggest < 1.1) { thing = new THREE.Mesh(new THREE.CylinderGeometry(.033, .033, .122, 40), plain(0xc0352b, .6)); thing.position.y = .061; label = 'Drinks can · 122 mm'; width = .066; }
  else {
    thing = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(.19, 1.12, 8, 20), plain(0x8fa3a0, 0)); body.position.y = .75;
    const head = new THREE.Mesh(new THREE.SphereGeometry(.115, 24, 18), plain(0x8fa3a0, 0)); head.position.y = 1.635;
    thing.add(body, head); label = 'Person · 1.75 m'; width = .42;
  }
  thing.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scaleGroup.add(thing);
  scaleGroup.position.set(box.max.x + width * .5 + Math.max(biggest * .12, width * .4), 0, (box.min.z + box.max.z) / 2);
  scaleGroup.userData.label = label;
  scaleBox = new THREE.Box3().setFromObject(scaleGroup);
}
function setMeasuring(on, kind) {
  measuring = !!on; rulerPoints = []; rulerLine.visible = false;
  scaleObject(measuring ? (kind || 'auto') : 'none', partsBox(0));
  if (!measuring) { dimBox.visible = false; for (const key in tags) tags[key].style.display = 'none'; }
  fit(); reportSizes();
}
function placeTag(tag, point, text, width, height) {
  projected.copy(point).project(camera);
  if (projected.z > 1) { tag.style.display = 'none'; return; }
  tag.style.display = ''; tag.textContent = text;
  tag.style.left = (projected.x + 1) / 2 * width + 'px'; tag.style.top = (1 - projected.y) / 2 * height + 'px';
}
function drawMeasure(width, height) {
  if (!measuring) return;
  const box = partsBox(explodeNow, selected.size ? selected : null);
  if (box.isEmpty()) { dimBox.visible = false; return; }
  dimBox.box.copy(box); dimBox.visible = true;
  const size = box.getSize(V()), lo = box.min, hi = box.max, mid = box.getCenter(V());
  placeTag(tags.w, V().set(mid.x, lo.y, hi.z), lengthText(size.x), width, height);
  placeTag(tags.h, V().set(hi.x, mid.y, hi.z), lengthText(size.y), width, height);
  placeTag(tags.d, V().set(hi.x, lo.y, mid.z), lengthText(size.z), width, height);
  if (rulerPoints.length === 2) placeTag(tags.ruler, rulerPoints[0].clone().lerp(rulerPoints[1], .5), lengthText(rulerPoints[0].distanceTo(rulerPoints[1])), width, height);
  else tags.ruler.style.display = 'none';
  if (scaleBox) placeTag(tags.scale, V().set(scaleGroup.position.x, scaleBox.max.y * 1.12, scaleGroup.position.z), scaleGroup.userData.label, width, height);
}
function rulerClick(point) {
  if (!point) return;
  if (rulerPoints.length >= 2) rulerPoints = [];
  rulerPoints.push(point.clone());
  rulerLine.visible = rulerPoints.length === 2;
  if (rulerPoints.length === 2) { rulerLine.geometry.setFromPoints(rulerPoints); reportSizes(); }
}

/* ---------- Cut-away: slice the model open on one axis ---------- */
renderer.localClippingEnabled = true;
const cutPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);
let cutting = null;
function eachMaterial(fn) {
  for (const p of parts) p.holder.traverse(o => { if (o.isMesh) for (const m of [].concat(o.userData.real || o.material || [])) if (m !== ghost) fn(m); });
}
function applyCut() {
  eachMaterial(m => {
    if (cutting) { if (m.userData.side === undefined) m.userData.side = m.side; m.side = THREE.DoubleSide; m.clippingPlanes = [cutPlane]; }
    else { if (m.userData.side !== undefined) { m.side = m.userData.side; delete m.userData.side; } m.clippingPlanes = null; }
    m.needsUpdate = true;
  });
  if (!cutting) return;
  const box = partsBox(explodeTo), axis = cutting.axis;
  if (box.isEmpty()) return;
  cutPlane.normal.set(axis === 'x' ? -1 : 0, axis === 'y' ? -1 : 0, axis === 'z' ? -1 : 0);
  cutPlane.constant = box.min[axis] + (box.max[axis] - box.min[axis]) * THREE.MathUtils.clamp(cutting.at, .02, .98);
}

/* ---------- Seeing the model whole for a moment (for a file, or for the builder's own check) ---------- */
function paintSelection() {
  const active = selected.size > 0;
  for (const p of parts) {
    const on = !active || selected.has(p.name);
    p.hidden = active && isolate && !on;
    p.holder.traverse(o => {
      if (!o.isMesh) { if (o.isLight || o.isLine || o.isPoints || o.isSprite) o.visible = on; return; }
      if (!on && !o.userData.real) { o.userData.real = o.material; o.userData.cast = o.castShadow; o.material = ghost; o.castShadow = false; }
      else if (on && o.userData.real) { o.material = o.userData.real; o.castShadow = o.userData.cast; delete o.userData.real; }
    });
  }
  for (const e of extras) e.hidden = active;
}
function pose(k) {   // every part where it belongs at pulled-apart amount k, fully arrived
  for (const item of [...parts, ...extras]) {
    item.holder.userData.born = -1e9; item.holder.scale.setScalar(1); item.holder.position.set(0, 0, 0);
    if (item.shift) item.holder.position.add(item.shift);
    if (item.explode) item.holder.position.addScaledVector(item.explode, k);
    item.holder.visible = !item.hidden;
  }
  root.updateMatrixWorld(true);
}
function whole(fn) {
  const keep = [selected, isolate, cutting];
  selected = new Set(); isolate = false; paintSelection();
  if (cutting) { cutting = null; applyCut(); }
  try { return fn(); }
  finally { [selected, isolate, cutting] = keep; paintSelection(); if (cutting) applyCut(); }
}

/* Four views on one sheet: three-quarter front, three-quarter back, from above, pulled apart. */
function reviewSheet() {
  if (!parts.length) return '';
  const cellW = 800, cellH = 600, sheet = document.createElement('canvas'); sheet.width = cellW * 2; sheet.height = cellH * 2;
  const g = sheet.getContext('2d'), size = renderer.getSize(new THREE.Vector2());
  const views = [[.62, .3, 0, 'THREE-QUARTER FRONT'], [.62 + Math.PI, .3, 0, 'THREE-QUARTER BACK'], [.62, 1.25, 0, 'FROM ABOVE'], [.62, .38, 1, 'PULLED APART']];
  whole(() => {
    renderer.setSize(cellW, cellH, false); camera.clearViewOffset(); camera.aspect = cellW / cellH; camera.updateProjectionMatrix();
    grid.visible = false; labelBox.style.visibility = 'hidden';
    views.forEach(([az, el, k, caption], i) => {
      pose(k);
      const box = partsBox(k); if (box.isEmpty()) return;
      const sphere = box.getBoundingSphere(new THREE.Sphere()), half = THREE.MathUtils.degToRad(camera.fov / 2);
      const dist = sphere.radius / Math.sin(Math.min(half, Math.atan(Math.tan(half) * camera.aspect))) * 1.08, flat = Math.cos(el) * dist;
      camera.position.set(sphere.center.x + Math.sin(az) * flat, sphere.center.y + Math.sin(el) * dist, sphere.center.z + Math.cos(az) * flat);
      camera.lookAt(sphere.center);
      renderer.render(scene, camera);
      const x = (i % 2) * cellW, y = (i >> 1) * cellH;
      g.drawImage(canvas, x, y, cellW, cellH);
      g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(x, y, 300, 30); g.fillStyle = '#fff'; g.font = '600 16px Segoe UI, sans-serif'; g.fillText(caption, x + 10, y + 21);
    });
    grid.visible = true; labelBox.style.visibility = '';
    renderer.setSize(size.x, size.y, false); applyInsets();
  });
  try { return sheet.toDataURL('image/jpeg', .88); } catch { return ''; }
}

/* ---------- Saving the model as a file ---------- */
function meshes() {
  const found = [];
  for (const p of parts) p.holder.traverse(o => { if (o.isMesh && o.geometry && o.geometry.attributes.position) found.push(o); });
  return found;
}
function stlFile() {   // binary STL in millimetres, Z up (what slicers and Fusion expect)
  const list = meshes(); let count = 0;
  for (const mesh of list) count += (mesh.geometry.index ? mesh.geometry.index.count : mesh.geometry.attributes.position.count) / 3 | 0;
  const buffer = new ArrayBuffer(84 + count * 50), view = new DataView(buffer); view.setUint32(80, count, true);
  const a = V(), b = V(), c = V(), n = V(); let at = 84;
  const put = v => { view.setFloat32(at, v.x * 1000, true); view.setFloat32(at + 4, -v.z * 1000, true); view.setFloat32(at + 8, v.y * 1000, true); at += 12; };
  for (const mesh of list) {
    const position = mesh.geometry.attributes.position, index = mesh.geometry.index, total = index ? index.count : position.count;
    for (let i = 0; i + 2 < total; i += 3) {
      const ia = index ? index.getX(i) : i, ib = index ? index.getX(i + 1) : i + 1, ic = index ? index.getX(i + 2) : i + 2;
      a.fromBufferAttribute(position, ia).applyMatrix4(mesh.matrixWorld); b.fromBufferAttribute(position, ib).applyMatrix4(mesh.matrixWorld); c.fromBufferAttribute(position, ic).applyMatrix4(mesh.matrixWorld);
      n.subVectors(b, a).cross(c.clone().sub(a)).normalize();
      view.setFloat32(at, n.x, true); view.setFloat32(at + 4, -n.z, true); view.setFloat32(at + 8, n.y, true); at += 12;
      put(a); put(b); put(c); at += 2;
    }
  }
  return buffer;
}
async function exportModel(format, nonce) {
  try {
    let buffer;
    if (format === 'glb') {
      const { GLTFExporter } = await import('/vendor/GLTFExporter.js');
      buffer = await whole(() => { pose(0); for (const e of extras) e.holder.visible = false; return new Promise((done, fail) => new GLTFExporter().parse(root, done, fail, { binary: true, onlyVisible: true })); });
    } else buffer = whole(() => { pose(0); return stlFile(); });
    parent.postMessage({ t: 'file', nonce, kind: format === 'glb' ? 'glb' : 'stl', data: buffer }, '*', [buffer]);
  } catch (error) { say({ t: 'file', nonce, kind: format, failed: String(error && error.message || error).slice(0, 200) }); }
}

/* ---------- A clip of it turning once ---------- */
let spin = null;
function record(nonce, seconds) {
  try {
    const kind = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
    const recorder = new MediaRecorder(canvas.captureStream(30), { mimeType: kind, videoBitsPerSecond: 8e6 }), chunks = [];
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => { const data = await new Blob(chunks, { type: 'video/webm' }).arrayBuffer(); parent.postMessage({ t: 'file', nonce, kind: 'webm', data }, '*', [data]); };
    spin = { from: orbit.azTo, start: performance.now(), ms: Math.max(2, Math.min(15, +seconds || 6)) * 1000, recorder };
    recorder.start();
  } catch (error) { say({ t: 'file', nonce, kind: 'webm', failed: String(error && error.message || error).slice(0, 200) }); }
}
function stepSpin(now) {
  if (!spin) return;
  const k = (now - spin.start) / spin.ms;
  orbit.az = orbit.azTo = spin.from + Math.min(k, 1) * Math.PI * 2;
  if (k >= 1) { const done = spin; spin = null; setTimeout(() => done.recorder.stop(), 120); }
}

/* ---------- Variants side by side ---------- */
let variantSets = null;
const variantTags = [];
function showVariants(list) {
  reset();
  variantSets = [];
  for (const variant of (Array.isArray(list) ? list : []).slice(0, 4)) {
    const firstPart = parts.length, firstExtra = extras.length;
    for (const step of variant.steps || []) run({ setup: variant.setup, code: step.code, name: step.name, quiet: true, silent: true });
    variantSets.push({ name: String(variant.name).slice(0, 40), items: [...parts.slice(firstPart), ...extras.slice(firstExtra)] });
  }
  motions = [];
  const boxOf = set => set.items.reduce((box, item) => item.box.isEmpty() ? box : box.union(item.box), new THREE.Box3());
  const gap = Math.max(...variantSets.map(set => { const box = boxOf(set); return box.isEmpty() ? .1 : box.getSize(V()).x; })) * 1.35;
  variantSets.forEach((set, i) => {
    const shift = V().set((i - (variantSets.length - 1) / 2) * gap, 0, 0);
    for (const item of set.items) { item.shift = shift; item.box.translate(shift); item.centre.add(shift); }
    set.box = boxOf(set);
  });
  while (variantTags.length) variantTags.pop().remove();
  for (const set of variantSets) { const tag = document.createElement('div'); tag.className = 'tag name'; tag.textContent = set.name; document.body.append(tag); variantTags.push(tag); }
  orbit.touched = false; firstFit = true; fit();
}
function drawVariants(width, height) {
  if (!variantSets) return;
  variantSets.forEach((set, i) => placeTag(variantTags[i], V().set((set.box.min.x + set.box.max.x) / 2, set.box.max.y * 1.12 + radius * .03, (set.box.min.z + set.box.max.z) / 2), (i + 1) + '  ' + set.name, width, height));
}

/* ---------- Messages from the Jarvis page ---------- */
addEventListener('message', event => {
  if (event.source !== parent || !event.data || typeof event.data !== 'object') return;
  const m = event.data;
  if (m.t === 'hello') say({ t: 'ready' });
  else if (m.t === 'reset') reset();
  else if (m.t === 'run') run(m);
  else if (m.t === 'explode') { explodeTo = m.on ? 1 : 0; fit(); }
  else if (m.t === 'insets') {
    const before = orbit.touched && [orbit.distTo, orbit.targetTo.clone()];
    Object.assign(inset, { right: +m.right || 0, bottom: +m.bottom || 0, top: +m.top || 0, left: +m.left || 0 }); applyInsets(); fit();
    if (before) { orbit.distTo = before[0]; orbit.targetTo.copy(before[1]); }   // the owner's own zoom and pan stay
  }
  else if (m.t === 'level') levelTo = Math.max(levelTo, Math.min(1, +m.v || 0));
  else if (m.t === 'fit') { orbit.touched = false; firstFit = true; fit(); }
  else if (m.t === 'select') {
    const names = new Set(parts.map(p => p.name));
    selected = new Set((Array.isArray(m.names) ? m.names : []).filter(n => names.has(n))); isolate = !!m.isolate && selected.size > 0;
    applySelection();
  }
  else if (m.t === 'photos') setPhotos(m.list);
  else if (m.t === 'motion') { const it = motions.find(x => x.name === m.name); if (it) { it.to = m.on ? 1 : 0; if (it.loop && !m.on) it.t = 0; } }
  else if (m.t === 'measure') setMeasuring(m.on, m.scale);
  else if (m.t === 'cut') { cutting = m.on ? { axis: ['x', 'y', 'z'].includes(m.axis) ? m.axis : 'x', at: Number.isFinite(+m.at) ? +m.at : .5 } : null; applyCut(); }
  else if (m.t === 'export') exportModel(m.format, m.nonce);
  else if (m.t === 'record') record(m.nonce, m.seconds);
  else if (m.t === 'variants') showVariants(m.list);
  else if (m.t === 'orbit') { orbit.touched = true; orbit.azTo -= (+m.dx || 0) * .012; orbit.elTo = THREE.MathUtils.clamp(orbit.elTo + (+m.dy || 0) * .01, -.15, 1.45); }
  else if (m.t === 'zoom') { orbit.touched = true; orbit.distTo = THREE.MathUtils.clamp(orbit.distTo / Math.max(.2, Math.min(5, +m.f || 1)), radius * .25, radius * 30); }
  else if (m.t === 'pickAt') clicked(+m.x, +m.y, false);
  else if (m.t === 'snapshot' && m.mode === 'review') say({ t: 'snapshot', nonce: m.nonce, data: syncSize() ? reviewSheet() : '' });
  else if (m.t === 'snapshot') {
    let data = '';
    if (syncSize() && parts.length) {
      // The picture must show the model as framed, even if the view only just opened and the camera is still gliding.
      orbit.dist = orbit.distTo; orbit.target.copy(orbit.targetTo); orbit.az = orbit.azTo; orbit.el = orbit.elTo; aim();
      for (const item of [...parts, ...extras]) { item.holder.userData.born = -1e9; item.holder.scale.setScalar(1); item.holder.position.set(0, 0, 0); if (item.explode) item.holder.position.copy(item.explode).multiplyScalar(explodeNow); }
      grid.visible = false; renderer.render(scene, camera);
      try { data = canvas.toDataURL('image/jpeg', .9); } catch {}
      grid.visible = true;
    }
    say({ t: 'snapshot', nonce: m.nonce, data });
  }
});
say({ t: 'ready' });
